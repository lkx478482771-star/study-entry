<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>学习系统入口</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: #0b0f16; color: #e6e9f0;
         font: 15px/1.7 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .box { max-width: 22rem; padding: 24px; text-align: center; }
  .spin { width: 22px; height: 22px; margin: 0 auto 14px; border-radius: 50%;
          border: 2px solid rgba(138,180,255,.25); border-top-color: #8ab4ff;
          animation: r .9s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
  .hint { color: #9aa4b8; font-size: 13px; }
</style>
<body>
<div class="box">
  <div class="spin"></div>
  <div id="msg">正在找你的学习系统…</div>
  <p class="hint" id="sub">收藏这一个页面就行，地址变了它会自己跟过去</p>
</div>
<script>
(function () {
  var msg = document.getElementById('msg');
  var sub = document.getElementById('sub');
  function fail(t) {
    msg.textContent = t;
    sub.textContent = '回电脑上：设置 → 外网访问 → 复制固定入口（重新收藏那条）';
  }
  var m = /[#&]t=([A-Za-z0-9_\-]+)/.exec(location.hash || '');
  if (!m) { fail('这个链接少了设备令牌'); return; }
  var token = m[1];
  var fallback = 'https://a30ffeb8932522.app.lhr.life';
  function go(origin) {
    if (!/^https:\/\/[A-Za-z0-9.\-]+$/.test(origin)) { fail('当前地址格式不对'); return; }
    msg.textContent = '找到了，正在打开…';
    location.replace(origin + '/?d=' + token);
  }
  fetch('current.json?ts=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (j) { go((j && j.origin) || ''); })
    .catch(function () {
      // 镜像缓存/同步失败时退回「发布时写进页面的那个地址」——旧地址可能已失效，但至少不白屏
      if (/^https:\/\/[A-Za-z0-9.\-]+$/.test(fallback)) { go(fallback); return; }
      fail('没找到当前地址：电脑上的外网访问可能没开');
    });
})();
</script>
</html>
